# 自動發布 Release
# 觸發時機：推送任何 git tag 時（例如 git tag 0.4.0 && git push --tags）
# 執行內容：build 專案 → 自動產生 changelog → 建立 GitHub Release
# 附件為 Obsidian 外掛標準三檔：main.js、manifest.json、styles.css
name: Release

on:
  push:
    tags:
      - '*' # 任何 tag 都會觸發

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 需要寫入權限才能建立 Release

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 取得完整 git 歷史，用於產生 changelog

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # 取得前一個 tag，用於產生兩個版本之間的 changelog
      - name: Get previous tag
        id: prev_tag
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          echo "tag=$PREV_TAG" >> $GITHUB_OUTPUT

      # 從 git log 自動產生變更紀錄
      - name: Generate changelog
        id: changelog
        run: |
          if [ -n "${{ steps.prev_tag.outputs.tag }}" ]; then
            CHANGELOG=$(git log ${{ steps.prev_tag.outputs.tag }}..HEAD --pretty=format:"- %s" --no-merges | grep -v "^- ${{ github.ref_name }}$" || true)
          else
            CHANGELOG=$(git log --pretty=format:"- %s" --no-merges | head -20)
          fi
          # 處理多行輸出
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      # 建立 GitHub Release 並上傳 Obsidian 外掛所需檔案
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          body: |
            ## What's Changed
            ${{ steps.changelog.outputs.notes }}

            **Full Changelog**: https://github.com/${{ github.repository }}/compare/${{ steps.prev_tag.outputs.tag }}...${{ github.ref_name }}
          files: |
            main.js
            manifest.json
            styles.css
