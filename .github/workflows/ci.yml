# 持續整合 (CI)
# 觸發時機：push 到 main 分支、或對 main 發起 PR
# 執行內容：ESLint 靜態分析 + TypeScript 型別檢查
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ESLint 靜態程式碼分析
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

  # TypeScript 型別檢查（不產生輸出檔案）
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck
